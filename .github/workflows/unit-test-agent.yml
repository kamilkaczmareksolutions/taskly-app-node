name: Unit-test agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: unit-test-agent-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      same_repo: ${{ steps.decide.outputs.same_repo }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          HAS_CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY != '' }}
        run: bash scripts/agent/detect.sh
      - name: Upload changed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-changed-files
          path: changed-files.json
          if-no-files-found: error

  agent:
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Download changed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-changed-files
          path: .
      - name: Install pinned Cursor CLI
        run: node scripts/agent/install-cursor-cli.mjs "${RUNNER_TEMP}/cursor-cli"
      - name: Run unit-test agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AGENT_BIN: ${{ runner.temp }}/cursor-cli/cursor-agent
        run: bash scripts/agent/run-agent.sh
      - name: Reject leaked API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: node scripts/agent/reject-secret.mjs agent-output.json agent.patch agent-report.json
      - name: Drop the raw agent log
        if: always()
        run: rm -f agent-output.json
      - name: Upload agent patch and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-agent-output
          path: |
            agent.patch
            agent-report.json
          if-no-files-found: error

  guard:
    needs: [detect, agent]
    if: needs.detect.outputs.should_run == 'true' && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Download agent output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-agent-output
          path: .
      - name: Apply patch and run deterministic guards
        run: |
          if [ -s agent.patch ]; then git apply --index agent.patch; fi
          node scripts/agent/guard-test-only-changes.mjs
          node scripts/agent/check-no-focus-skip.mjs agent.patch
          node scripts/agent/run-changed-tests.mjs test-results.json
      - name: Upload guard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-guard
          path: test-results.json
          if-no-files-found: ignore

  verify:
    needs: [detect, agent, guard]
    if: needs.detect.outputs.should_run == 'true' && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref || 'main' }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Coverage on base
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm run test:coverage --prefix backend
          npm run test:coverage --prefix frontend
          cp backend/coverage/coverage-summary.json "${RUNNER_TEMP}/base-backend.json"
          cp frontend/coverage/coverage-summary.json "${RUNNER_TEMP}/base-frontend.json"
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download agent output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-agent-output
          path: .
      - name: Typecheck and coverage on the patched head
        run: |
          if [ -s agent.patch ]; then git apply --index agent.patch; fi
          npm ci --prefix backend
          npm ci --prefix frontend
          npm run typecheck --prefix backend
          npm run typecheck --prefix frontend
          npm run test:coverage --prefix backend
          npm run test:coverage --prefix frontend
          node scripts/agent/coverage-summary.mjs --before "${RUNNER_TEMP}/base-backend.json" --after backend/coverage/coverage-summary.json > coverage-backend.json
          node scripts/agent/coverage-summary.mjs --before "${RUNNER_TEMP}/base-frontend.json" --after frontend/coverage/coverage-summary.json > coverage-frontend.json
          node --input-type=module -e "import { writeFileSync, readFileSync } from 'node:fs'; writeFileSync('coverage-delta.json', JSON.stringify({ backend: JSON.parse(readFileSync('coverage-backend.json', 'utf8')), frontend: JSON.parse(readFileSync('coverage-frontend.json', 'utf8')) }, null, 2)); writeFileSync('verify.json', JSON.stringify({ ok: true }));"
      - name: Record verify failure
        if: failure()
        run: printf '%s\n' '{"ok":false}' > verify.json
      - name: Upload verify result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-verify
          path: |
            coverage-delta.json
            verify.json
          if-no-files-found: ignore

  publish:
    needs: [detect, agent, guard, verify]
    if: always() && needs.detect.outputs.same_repo == 'true' && needs.detect.outputs.should_run == 'true' && (needs.agent.result == 'failure' || needs.guard.result == 'failure' || needs.verify.result == 'failure' || needs.verify.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download agent output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-agent-output
          path: .
        continue-on-error: true
      - name: Download guard result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-guard
          path: .
        continue-on-error: true
      - name: Download verify result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-test-verify
          path: .
        continue-on-error: true
      - name: Commit verified tests
        if: needs.verify.result == 'success'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/agent/publish-tests.sh
      - name: Render report
        env:
          AGENT_RESULT: ${{ needs.agent.result }}
          GUARD_RESULT: ${{ needs.guard.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          failure=""
          if [ "$AGENT_RESULT" != "success" ]; then
            failure="The agent failed before a patch was accepted. No tests were committed. The raw log is not copied here."
          elif [ "$GUARD_RESULT" != "success" ]; then
            failure="The deterministic guard rejected the patch. No tests were committed."
          elif [ "$VERIFY_RESULT" != "success" ]; then
            failure="Typecheck or coverage failed on a clean checkout of the patch. No tests were committed."
          fi
          args=(--report agent-report.json)
          if [ -f coverage-delta.json ]; then args+=(--coverage coverage-delta.json); fi
          if [ -f test-results.json ]; then args+=(--tests test-results.json); fi
          if [ -f verify.json ]; then args+=(--verify verify.json); fi
          if [ -n "$failure" ]; then args+=(--failure "$failure"); fi
          if [ ! -f agent-report.json ]; then printf '%s\n' '{"plan":[],"decisions":[],"skillsUsed":[],"testFilesWritten":[],"suspectedBugs":[],"evidence":[]}' > agent-report.json; fi
          node scripts/agent/render-report.mjs "${args[@]}" > report.md
      - name: Post sticky comment
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request to comment on."
            exit 0
          fi
          node scripts/agent/publish-comment.mjs report.md
